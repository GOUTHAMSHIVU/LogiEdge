---
- name: LogiEdge Model Update Workflow (Task E2)
  hosts: localhost
  connection: local
  vars:
    workspace_dir: "/opt/logiedge"
    model_version: "v2.0"
    confidence_threshold: "0.95"

  tasks:
    # Task 1: Stop the running inference container
    - name: Task 1 - Stop logiedge_inference container
      community.docker.docker_container:
        name: logiedge_inference
        state: stopped

    # Task 2: Copy the updated TFLite model asset
    - name: Task 2 - Copy updated model.tflite to workspace
      ansible.builtin.copy:
        src: "../inference/model.tflite"
        dest: "{{ workspace_dir }}/inference/model.tflite"
        mode: '0644'

    # Task 3: Copy the updated reference distribution file for PSI drift monitoring
    - name: Task 3 - Copy reference_dist.json to monitoring directory
      ansible.builtin.copy:
        src: "../monitoring/reference_dist.json"
        dest: "{{ workspace_dir }}/monitoring/reference_dist.json"
        mode: '0644'

    # Task 4: Pull or verify local container registry images
    - name: Task 4 - Pull latest container image from local registry
      community.docker.docker_image:
        name: "logiedge_inference:{{ model_version }}"
        source: local
        state: present

    # Task 5: Restart the inference container with updated environment variables
    - name: Task 5 - Restart logiedge_inference container with updated env vars
      community.docker.docker_container:
        name: logiedge_inference
        image: "logiedge_inference:{{ model_version }}"
        state: started
        restart: yes
        env:
          MODEL_VERSION: "{{ model_version }}"
          THRESHOLD: "{{ confidence_threshold }}"
          MODEL_PATH: "/app/inference/model.tflite"