---
- name: LogiEdge Model Update Workflow (Task E2)
  hosts: edge_nodes
  become: false
  vars:
    project_dir: /opt/LogiEdge

  tasks:

    #######################################################################
    # Task 1 - Stop the running inference container
    #######################################################################
    - name: Stop LogiEdge inference container
      ansible.builtin.command:
        cmd: docker stop LogiEdge_inference
      ignore_errors: true

    #######################################################################
    # Task 2 - Copy updated TensorFlow Lite model
    #######################################################################
    - name: Copy updated model.tflite
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../inference/model.tflite"
        dest: "{{ project_dir }}/inference/model.tflite"
        mode: "0644"

    #######################################################################
    # Task 3 - Copy updated PSI reference distribution
    #######################################################################
    - name: Copy updated reference_dist.json
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/reference_dist.json"
        dest: "{{ project_dir }}/monitoring/reference_dist.json"
        mode: "0644"

    #######################################################################
    # Task 4 - Rebuild inference image
    #######################################################################
    - name: Rebuild inference image
      ansible.builtin.command:
        cmd: docker compose build inference-service
      args:
        chdir: "{{ project_dir }}"

    #######################################################################
    # Task 5 - Restart inference service
    #######################################################################
    - name: Restart inference service
      ansible.builtin.command:
        cmd: docker compose up -d inference-service
      args:
        chdir: "{{ project_dir }}"

    #######################################################################
    # Task 6 - Verify container is running
    #######################################################################
    - name: Verify inference container
      community.docker.docker_container_info:
        name: LogiEdge_inference
      register: inference_status

    - name: Display deployment status
      ansible.builtin.debug:
        msg:
          - "Model update completed successfully."
          - "Inference container running: {{ inference_status.container.State.Running }}"
          - "Container name: LogiEdge_inference"