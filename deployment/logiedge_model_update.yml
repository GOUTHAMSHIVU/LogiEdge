---
- name: LogiEdge Model Update Workflow (Task E2)
  hosts: edge_nodes
  become: false

  vars:
    project_dir: /opt/LogiEdge

  tasks:

    - name: Ensure LogiEdge directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Copy updated model.tflite
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../inference/model.tflite"
        dest: "{{ project_dir }}/inference/model.tflite"
        mode: "0644"
      register: model_update

    - name: Copy updated reference_dist.json
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/reference_dist.json"
        dest: "{{ project_dir }}/monitoring/reference_dist.json"
        mode: "0644"
      register: reference_update

    - name: Stop LogiEdge inference container if update is required
      ansible.builtin.command:
        cmd: docker stop LogiEdge_inference
      when: model_update.changed or reference_update.changed
      failed_when: false

    - name: Pull updated inference container image
      ansible.builtin.command:
        cmd: docker compose pull inference-service
      args:
        chdir: "{{ project_dir }}"
      when: model_update.changed or reference_update.changed

    - name: Start inference container with environment variables
      ansible.builtin.command:
        cmd: docker compose up -d inference-service
      args:
        chdir: "{{ project_dir }}"
      register: start_result
      changed_when: start_result.stdout is search("Started|Created|Recreated")
      when: model_update.changed or reference_update.changed or start_result is not defined

    - name: Wait 15 seconds and verify inference container
      ansible.builtin.shell: |
        sleep 15
        docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' LogiEdge_inference
      register: inference_status
      changed_when: false
      failed_when: inference_status.stdout.strip() != "true"